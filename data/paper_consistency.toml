# ---------------------------------------------------------------- duplicated prose
# A duplicate is not a contradiction, which is why it passes every other rule here,
# and it is precisely how a claim comes to be corrected in one place and left standing
# in another. That is the failure class that broke rounds 6 to 8. The restructure to
# the venue's page limit moves more text than any previous one, so this rule goes in
# before the text does.
#
# main.tex is exempt because an abstract restates the body by design. Generated files
# and numbers.tex are exempt because they are data, not prose.
[duplicate]
window = 12
# shared/front.tex carries the title and abstract, which restate the body by design.
exempt_files = ["main.tex", "main-eprint.tex", "shared/front.tex"]
allow = []

# ---------------------------------------------------------------- stated once
# The venue's arrangement puts each limit beside the claim it bounds rather than in
# one trailing section. docs/review-standard.md created the single-place rule because
# rounds 6 to 8 generated their own work through caveat proliferation, so distributing
# them is only safe if a machine counts. Each phrase below is a limit or a scope
# statement that must be made exactly once, wherever it is made.

[[once]]
phrase = "a co-located attacker exploiting a shared cache, and a fault channel, are out of scope"
why = "the remit paragraph owns the channel boundary; section 2 stated it a second time"

[[once]]
phrase = "no analyser, no measurement and no hardware"
why = """The cold-clone claim is the artifact pitch and belongs to the Artifact run-in.
The method section describes the same split as a mechanism and had restated the tail
verbatim, eight words, which is under the duplicate rule's window. The phrase this rule
watches changed in round 15: it used to end "no containers", which was false for five of
the six recall-eligible pairs, and the retired entry above keeps the old wording out."""

[[once]]
phrase = "has no maintainer to coordinate with"
why = "the disclosure statement owns the MatrixSSL coordination fact"

[[once]]
phrase = "establishes that a blind spot exists in a class, not how often it occurs"
why = "the n=1 bound is stated in the remit and must not be re-hedged at each use"

[[once]]
phrase = "so the core frequency is not pinned and core isolation is partial"
why = "the acquisition host's bound is stated once, where the statistics are decided"

# ---------------------------------------------------------------- the anti-survey gate
# The analyser matrix classifies a field this paper explicitly did not survey: its rows are
# a pinned third-party inventory filtered by two of that inventory's own predicates. The
# table is scaffolding for a scoring claim, not a systematisation, and TCHES has a separate
# SoK category for work that is. A rule you can enforce beats a rule you remember.

[[forbidden]]
phrase = "we survey"
in_files = ["sec/f1-blindspots.tex"]
why = "the rows are a third-party inventory; claiming a survey would be false and would invite the paper to be read as an SoK"

[[forbidden]]
phrase = "we systematise"
in_files = ["sec/f1-blindspots.tex"]
why = "same"

[[forbidden]]
phrase = "our classification of the field"
in_files = ["sec/f1-blindspots.tex"]
why = "same: the classification axes are ours, the rows are not"

# ---------------------------------------------------------------- cannot both be true
# The register of claim pairs that have contradicted each other once. The duplicate and
# once rules cannot see this class, because the two statements share no wording: they are
# opposites, not copies. All three entries below shipped on 2026-08-26 in a single day of
# editing, each because a claim was updated in one place and its opposite left standing in
# another, and all three were found by a blind referee rather than by any gate here.

[[contradiction]]
claim = "we do not establish that the deployed signing path executes it"
against = "no longer an inference"
why = """The abstract denied the deployment link while the fix section asserted it. The
paper now states the intermediate claim in both: source dispatch and a whole-signature cost
budget place a routine costing all but the measured gap (mxGenkeyGap) of the signing path's
own key generation inside the signature, and the residual was measured on that routine
called directly. "Indistinguishable" is not used for that gap: it is consistent in sign
across every containment run."""

[[contradiction]]
claim = "each arm is one acquisition"
against = "acquired \\mxReps{} times"
why = """The ladder figure's caption still described the single-acquisition regime after the
rebuild replaced it with three acquisitions per design, and in the same caption claimed to
draw no ratio while printing one."""

[[contradiction]]
claim = "says which three groups those are"
against = "after the rebuild two remain"
why = """The introduction promised three groups of non-recomputable quantities and the fix
section named two. The count is now stated in exactly one place and pointed at from the
other."""
