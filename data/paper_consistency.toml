# Machine-checkable consistency rules for the paper, enforced by bin/paper_check.py.
#
# WHY THIS FILE EXISTS
# Across blind-review rounds 6 to 8 the referees' blocking items were dominated by one
# class: a claim corrected in the body while a stale copy survived in a table, a caption or
# an appendix, and a percentage printed beside a numerator it does not divide. Every one of
# those is individually well formed, so no LaTeX or number gate sees it, and each round of
# fixes created the next round's findings. That is the same failure the corpus already has
# a control for (INST-1) pointed at the manuscript instead of the instruments.
#
# Six rule kinds, all declarative, all read by bin/paper_check.py:
#   [[retired]]      a claim that was withdrawn. It must not appear anywhere in the paper.
#   [[forbidden]]    vocabulary refused in a named file (the anti-SoK gate).
#   [[once]]         a claim that must appear in exactly one file.
#   [[contradiction]] a pair of phrases that must not both appear.
#   [duplicate]      no normalised window of N words may appear in two files (a single
#                    table, not an array: it has one window and one exempt list).
#   [[ratio]]        a printed percentage must equal its printed numerator over its printed
#                    denominator, both read from numbers.tex, within tolerance.

