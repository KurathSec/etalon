# The analysers under measurement, and what each can see.
#
# Applicability is computed from these declarations, not adjudicated. A tool that
# cannot observe a pair's leak channel, or cannot read the level at which the
# leak exists, is inapplicable to that pair by construction, and inapplicable is
# excluded from the denominator rather than counted as a miss. Getting this wrong
# is how a recall number becomes dishonest.

schema = "tools/1"

[tool.dudect]
version = "dc269651"
# Declared capabilities are sourced from the tool's own literature, not asserted by
# us, so the applicability computation rests on documentation rather than opinion.
capability_source = "Reparaz, Balasch, Verbauwhede, DATE 2017 [dudect]: a Welch t-test over two input-timing classes; observes execution latency only."
scored_against = "exploit"  # measures the timing magnitude an attacker consumes
image   = "localhost/ct-toolchain/dudect:1"
technique = "statistical"
level     = "binary"
# dudect times execution, so it observes latency. It cannot see an
# address-only leak that does not change timing, and it cannot be pointed at a
# hardware module with no binary to run.
observes  = ["latency"]
detects_mechanisms = ["secret-branch", "variable-latency-op"]
secret_model = "two_class_sampling"
# Retired: the PR-1 |t| bands (a leak above band_leak, clean below band_clean,
# inconclusive between). No verdict has read them since PR-4 replaced the band with
# the permutation null (bin/dudect_permute.py); kept as the record of the pilot rule.
band_leak = 500
band_clean = 10
architectures = ["x86_64"]
# dudect needs a runnable harness that feeds two input classes. A pair scored
# only on recorded observations (Minerva, TPM-FAIL) has no such harness here, so
# dudect is not applicable to it: there is no program for dudect to run.
requires_harness = "two_class"
platform_sensitive = true

[tool.timecop]
version = "valgrind-3.19.0"
capability_source = "Neikes, TIMECOP (ctgrind lineage) [timecop]: poisons secret bytes under memcheck and reports secret-dependent branches and memory accesses. The exclusion of variable-latency instructions is the tool's own statement, not our inference: its page says 'Valgrind cannot spot cases where variable-time code is caused by variable-time CPU instructions' (retrieved 2026-08-26)."
scored_against = "policy"  # reports a secret-dependent branch/address, exploitable or not
image   = "localhost/ct-toolchain/timecop:1"
technique = "dynamic-taint"
level     = "binary"
# TIMECOP poisons secret bytes and reports branches or memory accesses on them.
# It observes control-flow and address leaks. It does NOT observe a
# variable-latency instruction operating on defined data, which is the KyberSlash
# class; detecting that is exactly what the KyberSlash paper had to patch valgrind
# to do. Encoding that boundary here is what makes the applicability honest.
# That boundary is quoted rather than inferred: the tool's own page states
# "Valgrind cannot spot cases where variable-time code is caused by variable-time
# CPU instructions." Authorship corrected 2026-08-26: the tool is by Moritz Neikes
# (contact moritz@post-apocalyptic-crypto.org), not Peter Schwabe as an earlier
# revision of this file and of refs.bib both had it.
observes  = ["address-data", "address-code"]
# Both mechanisms, not just the branch: memcheck reports an UninitCondition for a
# branch on poisoned data and an UninitValue for a memory access indexed by it, and
# the adapter distinguishes the two kinds. An earlier revision declared this tool
# branch-only, which contradicted its own capability_source and the adapter, and
# would have wrongly excluded it from an address-only pair.
detects_mechanisms = ["secret-branch", "address-data"]
secret_model = "annotation"
architectures = ["x86_64"]
requires_harness = "poison"
platform_sensitive = false

[tool.varlat]
version = "valgrind-3.22.0+varlat"
capability_source = "Chia, varlat Valgrind patch shipped with KyberSlash, TCHES 2025(2) [kyberslash]: flags variable-latency instruction operands on secret or uninitialised data."
scored_against = "policy"  # reports a variable-latency instruction on secret operands
# Provenance, disclosed because it is a by-construction relationship: varlat is the
# instrument the KyberSlash authors wrote to catch that exact division class, so its
# detection of KyberSlash is guaranteed by construction and is reported as such. The
# pair is tier C, so the cell is outside every recall denominator regardless.
provenance = "built-for:kyberslash"
image   = "localhost/ct-toolchain/varlat:1"
technique = "patched-valgrind"
level     = "binary"
# The KyberSlash patched Valgrind. Detects variable-latency instructions (idiv/div)
# on secret data, which is the class dudect misses on a fast x86 divider, AND, being
# memcheck-based, secret-dependent branches. This is the tool the KT2 investigation
# was about; it is what makes the division-timing class detectable on x86.
observes  = ["latency", "address-code"]
detects_mechanisms = ["variable-latency-op", "secret-branch"]
secret_model = "annotation"
architectures = ["x86_64"]
requires_harness = "poison"
platform_sensitive = false

[tool.binsec]
version = "binsec-checkct"
capability_source = "Daniel, Bardin, Rezk, Binsec/Rel, S&P 2020 [binsecrel]: relational symbolic execution deciding constant-time over explored paths; the divisor/dividend features are the later extension that reaches the division class. Probed directly from the pinned image on 2026-08-26: `binsec -checkct-help` lists `-checkct-features control-flow, memory-access, multiplication, dividend and divisor` and states that the multiplication and division checks are experimental."
scored_against = "policy"  # decides a constant-time policy over explored paths
# Provenance, dated rather than hedged (2026-08-26). An earlier revision of this file
# said these features "may postdate" the KyberSlash disclosure. They do: BINSEC's
# CHANGES.md puts `-checkct-features control-flow,memory-access,multiplication,
# dividend,divisor` in release 0.10.0 of 2025-02-16, after the disclosure. The
# capability is nonetheless correct for the image actually run, which is not an
# inference from a version string: the pinned image was probed and its own option
# list carries both features. What follows is a weaker cousin of varlat's caveat.
# varlat was WRITTEN to detect this class, so its detection is by construction;
# binsec is a general tool that GAINED the check after the class became salient, so
# its detection is not evidence that a tool predating the disclosure would have
# caught the pair. The pair is tier C and outside every denominator either way.
provenance = "postdates:kyberslash"
image   = "docker.io/binsec/binsec@sha256:2a51e455f055874d71cbf030a778e8be19455876bcd57c1845c163fed6fc482f"
# The release the pinned digest is: `binsec -version` inside the image prints
# "Binsec version dfe4739", and dfe4739 is the commit upstream tags 0.11.2 (probed
# 2026-08-27). Recorded so the paper can cite the release its varlat cell rests on
# rather than a digest, and so that -checkct-features dividend,divisor of 0.10.0 is
# shown to be inside the image actually run.
image_version = "0.11.2"
image_version_probe = "binsec -version in the pinned image: 'Binsec version dfe4739'; upstream tag 0.11.2 is dfe4739f03a474cf2ebc5ae419760e57ce0050c3"
technique = "symbolic-relse"
level     = "binary"
# Binsec/Rel2 relational symbolic execution. Proves or refutes constant time over
# the explored inputs rather than sampling time. With control-flow it sees a
# secret-dependent branch; with memory-access, a secret-dependent address; with
# the experimental divisor/dividend features, a variable-latency division on
# secret operands, which is the KyberSlash class. It marks secrets by symbol name
# in an SSE script, so a pair needs a binsec driver exposing them as globals.
observes  = ["control-flow", "address-data", "latency"]
detects_mechanisms = ["secret-branch", "address-data", "variable-latency-op"]
secret_model = "symbolic-annotation"
architectures = ["x86_64"]
requires_harness = "sse_script"
platform_sensitive = false
