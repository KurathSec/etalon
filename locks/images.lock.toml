note = "checkct works via: binsec -sse -checkct -checkct-features memory-access,control-flow,divisor,dividend -sse-script SCRIPT -sse-depth D -sse-timeout T CORE. Needs a per-pair gdb core snapshot with secret buffers marked symbolic (starting from core with @[addr] := nondet as secret). The image has gdb but not gcc, so the core is generated in a build cell. This per-pair harness is the outstanding work."

[image.microwalk]
