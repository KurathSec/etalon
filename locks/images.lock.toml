status = "pulled; Pin confirmed working on this Arrow Lake CPU; per-target YAML harness outstanding"
note = "The flagged Pin-on-Arrow-Lake risk did NOT materialise: pin instruments /bin/true and traces (exit 0). Microwalk needs a per-target YAML pipeline (trace/preprocess/analyse) and a target library exposing its plugin API; that harness is the outstanding work. The address-data mechanism these pairs carry is already detected by TIMECOP (a secret-indexed access on poisoned data), so the address cell is scored without Microwalk."
