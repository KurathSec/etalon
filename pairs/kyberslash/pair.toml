schema = "pair/1"

[pair]
id      = "kyberslash"
title   = "KyberSlash1: secret-dependent division in the Kyber reference code"
role    = "corpus"
status  = "active"
tier    = "C"
added   = "2026-08-23"
synthetic = false
summary = """
The Kyber reference implementation reduces a secret-dependent coefficient to a
message bit by dividing by KYBER_Q, which is 3329 and not a power of two. On a
target whose integer division has data-dependent latency, decapsulation time
leaks the secret. This pair isolates that function, coeff_to_bit, verbatim from
the pinned pre-fix commit, against the multiply-shift the fix introduced.

Tier C. The published key recovery runs only on Arm Cortex-A7 and Cortex-M4 with
the cycle counter, and this repository has no cross toolchain and no qemu-user,
so the recovery cannot be run here yet. The pair is therefore NOT recall-eligible
and never enters a denominator. What it does contribute today is fully portable:
the build across compiler cells, and the evidence of whether the division
survives as a variable-latency instruction, which is the corpus's central
toolchain-pinning claim.
"""

[class]
observable   = "latency"
secret_role  = "key-material"
origin       = "hardware-implicit"
granularity  = "word"
exploit_path = "direct-recovery"
mechanism_classes = ["variable-latency-op"]
rationale = """
This is the sharp case and the reason the corpus exists. origin is
hardware-implicit: the C source contains no branch and no secret-indexed load,
and on a target with a constant-time divider the same source is constant time.
The violation is introduced by instruction selection, which is exactly why the
pair pins a toolchain rather than shipping a .c file.

observable is latency and not addresses. The instruction sequence is identical
whatever the operand, and only the divider's latency varies, so a differential
address-trace analyser is blind to it by construction. That is the contrast the
whole corpus is built to make measurable.
"""

[provenance]
provenance_kind = "vendored-reproduction"
provenance_kind_note = """
The vulnerable arm is pq-crystals/kyber's coeff_to_bit excised verbatim at the pre-fix commit; the patched arm applies upstream's fix to that same source.
"""
upstream_repo   = "pq-crystals/kyber"
upstream_commit = "a621b8dde405cc507cbcfc5f794570a4f98d69cc"
vulnerable_commit = "a621b8dde405cc507cbcfc5f794570a4f98d69cc"
disclosed       = "2023-12-15"
doi             = ["10.46586/tches.v2025.i2.209-234"]
advisory        = ["CVE-2024-37880"]
licence         = "CC0-1.0"
redistributable = true
note = """
The reference implementation is public domain (CC0). The leak site is taken
verbatim from ref/poly.c at the pinned pre-fix commit; the KyberSlash artifact
(artifacts.iacr.org/tches/2025/a9) pins the same commit for its own vulnerable
build. CVE-2024-37880 is the KyberSlash assignment.
"""

[[build]]
arm = "vulnerable"
source = "src/vulnerable.c"
entry_symbol = "coeff_to_bit"
secret_input = "the coefficient t, secret-dependent on the decapsulation path"

[[build]]
arm = "patched"
source = "src/patched.c"
entry_symbol = "coeff_to_bit"
secret_input = "identical, reduced by multiply-shift instead of division"
note = "functionally equal to the vulnerable arm over the whole input range, verified exhaustively"

[[site]]
arm = "vulnerable"
file = "src/vulnerable.c"
symbol = "coeff_to_bit"
mechanism = "division of a secret-dependent value by KYBER_Q, a non-power-of-two"
instruction_class = ["div", "idiv", "divl", "divw", "udiv", "sdiv", "__udivsi3", "__divsi3", "__aeabi_idiv", "__aeabi_uidiv"]

[toolchain]
cells_required = ["gcc-12.2.0-Os-x86_64-linux-gnu", "clang-14.0.6-O0-x86_64-linux-gnu"]
# MEASURED across two vendors, not assumed. The secret-dependent division
# survives as a hardware division instruction in gcc 12.2.0 only at -Os, and in
# clang 14.0.6 only at -O0. Everywhere else each compiler replaces it with a
# constant-time reciprocal multiply on its own. The two vendors disagree on
# which cells are safe: neither compiler is safe at every optimisation level,
# no level is unsafe under both, and which of the size and zero levels emits
# the division depends on the vendor. The
# declared ground-truth cells are the two where the leak is emitted; the other
# six are recorded by BIN-2 as the toolchain-pinning finding, the same source
# compiling to constant-time code under a different build. This is the corpus's
# central claim, produced as a measurement. See results/kyberslash_emission.json.
[toolchain.axes.vendor]
values = ["gcc-12.2.0", "clang-14.0.6"]
reason = "Two vendors is the minimum that can show the emission depends on the vendor and not only the optimisation level, and here they disagree."

[toolchain.axes.opt]
values = ["O0", "O2", "O3", "Os"]
reason = """
The central sweep for this pair. Whether a compiler emits a hardware division or
replaces it with a reciprocal multiply determines whether the leak exists in the
built binary. MEASURED result: gcc 12.2.0 emits the division only at -Os; clang
14.0.6 emits it only at -O0. The two disagree: neither vendor is safe at every
level and no level is unsafe under both, only the size and zero levels emit at
all. This is the strongest available demonstration that a
source-only benchmark measures the compiler, and it is a measurement rather than
a citation. See results/kyberslash_emission.json.
"""

[acquisition]
origin    = "none"
platform  = "Arm Cortex-A7 / Cortex-M4 with cycle counter (not available here)"
procedure = "not yet reproduced"
counter   = "cortex-a7-pmccntr"
reps      = 0
grade     = "smoke"
note = "Tier C: acquisition needs Arm hardware this host does not have. Recorded as not reproduced rather than assumed."

[recovery]
entry   = "not yet implemented"
runtime = "image"
inputs  = []
note = "The published recovery is Arm-only. Ordering a Raspberry Pi 2 converts this pair to tier A; until then it contributes build evidence only."

[oracle]
verifier   = "recover/fixtures/verifier.json"
predicate  = "not-yet-reproduced"
expected_vulnerable = "recovered"
expected_patched    = "not-recovered"
note = "Expectations are declared for when the Arm acquisition exists. The oracle does not run for a tier C pair, and verify.py skips it because its trace files are absent."

[cost]
effort_hours = 2
portable_hours = 2
note = "Portable clock only. The acquisition clock is unmeasured for a KEY RECOVERY, which needs Arm hardware not in hand. The leak PRESENCE was measured on a rented aarch64 host on 2026-08-23 (UTC); see results/kyberslash_graviton.json and pairs/kyberslash/graviton/."

[divergence]
from_deployment = """
The deployment was full decapsulation in a shipped library on Arm; this isolates
coeff_to_bit and builds it on x86. The measured question here is only whether the
division instruction is emitted, which is a property of the compiler and target
and is faithfully reproduced. The exploit itself is not reproduced here.

Added 2026-08-23 (UTC): the leak's magnitude is microarchitecture dependent, and
this was measured on a rented AWS Graviton3 (Neoverse V1) host, not just asserted.
See results/kyberslash_graviton.json. On aarch64 at -Os the source emits a real
udiv w0,w0,w2, whose latency on Neoverse V1 depends on the operand: over the
KyberSlash operand range it steps at dividend = divisor = 3329, so the running
time of coeff_to_bit leaks one bit per coefficient, whether the coefficient
exceeds about 833. End to end the real reduction takes 6.02 ticks per call for
low coefficients and 6.37 for high, a roughly one cycle secret dependent
difference, cleanly measurable. This is much quieter than the deployed Cortex-A7
leak, which is tens of cycles because the build emits the software helper
__aeabi_idiv rather than a divide instruction. The reason is the build target, not
the core: the Cortex-A7 does implement UDIV and SDIV, and a distribution image
compiled for ARMv6, where the instruction is not architecturally available, lowers
the division to that helper. So this is the toolchain-pinning finding acting at a
third target rather than a property of the core alone. Same source, same -Os build, tens of cycles
on one core and about one cycle on another: the toolchain pinning finding extends
to microarchitecture. A key recovery was not run on Graviton, so the pair stays
tier C.
"""

[[divergence.structured]]
axis       = "microarchitecture"
deployed   = "Cortex-A7 running an ARMv6-target build, software division __aeabi_idiv, tens of cycles; the core itself has UDIV/SDIV, so the helper comes from the build target"
reproduced = "Neoverse V1 hardware udiv, a one cycle step at dividend = divisor"
effect     = "the leak class is present on both, but its magnitude is a property of the microarchitecture, not only the source or the build"
