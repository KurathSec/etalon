[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "etalon"
version = "0.0.1"
description = "A known-answer recall corpus for constant-time analysers."
readme = "README.md"
requires-python = ">=3.11"
license = { file = "LICENSE" }

# No runtime dependencies, by design. A reviewer must be able to run the oracle
# from a cold clone with a stock interpreter, no lockfile resolution and no
# compiled extension. The portable half of the oracle is the deliverable, and a
# dependency is one more thing that can fail to install two years from now.
dependencies = []

# The TOOLING is not the oracle. bin/ regenerates figures and statistics with
# numpy and matplotlib, and the tests need pytest; none of that is needed to run
# bin/verify.py, which stays stdlib plus the pinned recovery image.
[project.optional-dependencies]
dev = ["pytest", "numpy", "matplotlib"]

[project.scripts]
corpus = "corpus.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus"]

[tool.pytest.ini_options]
testpaths = ["tests"]
